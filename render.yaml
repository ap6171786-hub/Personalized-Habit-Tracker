services:
  - type: web
    name: personalized-habit-tracker-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ML_SERVICE_URL
        value: https://${{personalized-habit-tracker-ai.host}}
      - key: CORS_ORIGINS
        value: https://personalized-habit-tracker-web.onrender.com

  - type: web
    name: personalized-habit-tracker-ai
    runtime: python
    region: singapore
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: personalized-habit-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://${{personalized-habit-tracker-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
